name: formal
# SymbiYosys properties (mask stack, scheduler, decode completeness, write-port). Comes
# online in Phase 4; manual trigger until then.
on:
  workflow_dispatch:

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Yosys + z3 + SymbiYosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install
          sby --version
      - name: make formal
        run: make formal
