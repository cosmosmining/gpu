name: fuzz
# Constrained-random lockstep campaign (>=10k programs, 0 mismatches). Comes online in
# Phase 3; manual trigger until then so it doesn't gate pre-Phase-3 commits.
on:
  workflow_dispatch:
    inputs:
      programs:
        description: "number of programs"
        default: "10000"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools + build Verilator (cocotb 2.0 needs >=5.036; apt has 5.020)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys autoconf flex bison libfl-dev help2man
          python -m pip install --upgrade pip
          pip install pyyaml cocotb pytest numpy
          git clone --depth 1 https://github.com/verilator/verilator /tmp/verilator
          cd /tmp/verilator && autoconf && ./configure && make -j"$(nproc)" && sudo make install
          verilator --version
      - name: make fuzz
        run: FUZZ_N=${{ inputs.programs }} make fuzz
      - name: coverage report
        run: make cov
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage
          path: dv/fuzz/coverage.json
