name: gds
# Signoff GDS via the official Tiny Tapeout GDS action (sky130A, shuttle TTSKY26c).
# The RTL is kept canonically in rtl/; this workflow stages it into src/ (the layout the
# TT flow expects) and regenerates the decoder include from isa/ISA.yaml. Runs LibreLane
# hardening in CI (the PDK is fetched there). Manual trigger.
on:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage RTL into src/ for the TT flow
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python scripts/gen_decoder.py
          mkdir -p src
          cp rtl/core/warpone_decode.vh rtl/core/warpone_core.v rtl/tt_top/tt_um_warpone.v src/
          cp pnr/config.json src/config.json
      - uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage RTL into src/ for the TT flow
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python scripts/gen_decoder.py
          mkdir -p src
          cp rtl/core/warpone_decode.vh rtl/core/warpone_core.v rtl/tt_top/tt_um_warpone.v src/
          cp pnr/config.json src/config.json
      - uses: TinyTapeout/tt-gds-action/precheck@ttsky26c
