name: nightly
# Scheduled health check. Phase 0: smoke + tool report. Grows to full regress + fuzz.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: smoke + tools
        run: |
          make smoke
          make tools
          make lint
